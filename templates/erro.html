<!doctype html>
{# Página de erro: SEM extends e sem depender do banco (é renderizada mesmo quando o problema é o próprio banco).
   Nunca mostra detalhes técnicos: só o código, um título e uma mensagem escritos no app.py. #}
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>NEOCORTEX — {{ titulo }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any">
  <style>
    :root { color-scheme: light dark; --fundo: #F4F6FB; --cartao: #FFFFFF; --borda: #E2E8F0; --texto: #0F172A; --texto2: #475569; --destaque: #4F46E5; }
    @media (prefers-color-scheme: dark) { :root { --fundo: #0F172A; --cartao: #1E293B; --borda: #334155; --texto: #F1F5F9; --texto2: #94A3B8; --destaque: #A5B4FC; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           background: var(--fundo); color: var(--texto); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { width: 100%; max-width: 460px; background: var(--cartao); border: 1px solid var(--borda); border-radius: 20px; padding: 36px 32px; text-align: center; }
    .codigo { margin: 0; font-size: 56px; font-weight: 800; line-height: 1; color: var(--destaque); letter-spacing: -0.02em; }
    h1 { margin: 14px 0 8px; font-size: 20px; font-weight: 800; }
    p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: var(--texto2); }
    a { display: inline-block; padding: 12px 26px; border-radius: 12px; background: linear-gradient(135deg, #2563EB, #7C3AED); color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--destaque); outline-offset: 3px; }
  </style>
</head>
<body>
  <main role="alert">
    <p class="codigo" aria-hidden="true">{{ codigo }}</p>
    <h1>{{ titulo }}</h1>
    <p>{{ mensagem }}</p>
    <a href="{{ destino }}">Voltar</a>
  </main>
</body>
</html>
