<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEOCORTEX — Conta criada</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='common.css') }}">
</head>
<body>
<div style="display:flex;flex-direction:column;height:100vh;">
    <div class="step-header">
      <div class="blob blob1"></div><div class="blob blob2"></div>
      <img class="logo-mark" src="{{ url_for('static', filename='logo.png') }}" alt="NEOCORTEX">
      <div></div>
    </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;">
    <div class="nc-card" style="width:100%;max-width:420px;padding:48px 40px;text-align:center;">
      <div style="width:80px;height:80px;border-radius:50%;background:rgba(34,197,94,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;font-size:34px;color:#22C55E;">✓</div>
      <h2 style="margin:0 0 12px;font-size:26px;font-weight:800;color:var(--nc-text);letter-spacing:-0.4px;">Conta criada com sucesso!</h2>
      <p style="margin:0 0 36px;font-size:15px;font-weight:500;color:var(--nc-text2);line-height:1.65;">
        Seja bem-vindo(a), <strong style="color:var(--nc-text);font-weight:800;">{{ session.nome }}</strong>! 🎉<br>Seu espaço está pronto.
      </p>
      <a href="{{ url_for('tarefas') }}" class="btn-primary" style="width:100%;height:50px;display:flex;align-items:center;justify-content:center;text-decoration:none;">Ir para o início</a>
    </div>
  </div>
</div>
</body>
</html>
