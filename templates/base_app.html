<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>NEOCORTEX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">

    <div class="sidebar">
      <div class="sidebar-brand">
        <strong>NEOCORTEX</strong>
      </div>
      <div class="nav">
        <button class="{{ 'active' if pagina == 'tarefas' else '' }}"
                onclick="window.location.href='{{ url_for('tarefas') }}'">Tarefas</button>
        <button class="{{ 'active' if pagina == 'dashboard' else '' }}"
                onclick="window.location.href='{{ url_for('dashboard') }}'">Dashboard</button>
        <button class="logout" onclick="window.location.href='{{ url_for('logout') }}'">Sair</button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="top-title">{{ titulo_pagina }}</div>
        <div class="user-avatar">{{ inicial_usuario }}</div>
      </div>

      <div class="page">
        <div class="container">
          {% block conteudo %}{% endblock %}
        </div>
      </div>
    </div>

  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
